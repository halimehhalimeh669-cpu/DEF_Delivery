name: Build DEF Delivery Release
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          packages: platform-tools

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Locate Android project inside uploaded ZIP
        run: |
          mkdir -p source
          unzip -q DEFDelivery_Black_Gold_Final.zip -d source
          PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found inside DEFDelivery_Black_Gold_Final.zip"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

          find "$PROJECT_DIR/app/src" -type f \( -name "ic_launcher.xml" -o -name "ic_launcher_round.xml" \) -exec sed -i 's|@drawable-nodpi/|@drawable/|g' {} +

      - name: Upload unpacked source for notification integration review
        uses: actions/upload-artifact@v4
        with:
          name: DEF-Delivery-source-review
          path: ${{ env.PROJECT_DIR }}
          if-no-files-found: error

      - name: Decode release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing KEYSTORE_BASE64 GitHub secret" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-upload-key.jks"
          test -s "$RUNNER_TEMP/my-upload-key.jks"

      - name: Build signed release APK and AAB
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || (echo "Missing STORE_PASSWORD GitHub secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing KEY_PASSWORD GitHub secret" && exit 1)
          gradle --no-daemon -p "$PROJECT_DIR" :app:assembleRelease :app:bundleRelease

      - name: Upload signed release files
        uses: actions/upload-artifact@v4
        with:
          name: DEF-Delivery-release
          path: |
            ${{ env.PROJECT_DIR }}/app/build/outputs/apk/release/app-release.apk
            ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          
