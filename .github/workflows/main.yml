
name: Build DEF Delivery APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Extract project and inspect source
        run: |
          mkdir -p source
          unzip -q DEFDelivery_Black_Gold_Final.zip -d source

          PROJECT_DIR=$(find source -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 | xargs dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "Android project not found"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "========== MAIN ACTIVITY =========="
          cat "$PROJECT_DIR/app/src/main/java/com/example/MainActivity.kt"

          echo "========== FIRESTORE RULES =========="
          cat "$PROJECT_DIR/firestore.rules"

          echo "========== APP GRADLE =========="
          cat "$PROJECT_DIR/app/build.gradle.kts"

          find source -type f \( -name ic_launcher.xml -o -name ic_launcher_round.xml \) -exec sed -i 's|@drawable-nodpi/|@drawable/|g' {} +

      - name: Patch audible new-order notifications
        run: python3 scripts/add-order-notifications.py "$PROJECT_DIR"

      - name: Patch Firebase Cloud Messaging support\n        run: python3 scripts/add-fcm-push.py "$PROJECT_DIR"\n\n      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$PROJECT_DIR/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Build APK
        run: gradle --no-daemon -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DEF-Delivery-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
